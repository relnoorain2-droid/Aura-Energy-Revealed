name: iOS Build

# Compile-only verification. Deliberately requires NO signing and NO secrets,
# so it runs on every push. Signing is handled in testflight.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Show available schemes
        run: xcodebuild -list -project AuraEnergyRevealed.xcodeproj

      # Building for the simulator destination verifies the whole module
      # compiles in Release without needing a signing certificate at all.
      - name: Build for iOS Simulator (Release, code signing disabled)
        run: |
          set -euo pipefail
          xcodebuild \
            -project AuraEnergyRevealed.xcodeproj \
            -scheme AuraEnergyRevealed \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Confirm app bundle was produced
        run: find build/DerivedData/Build/Products -maxdepth 3 -name "*.app" -print
